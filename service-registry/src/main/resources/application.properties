spring.application.name=service-registry
server.port=8761

eureka.instance.hostname=localhost
eureka.client.fetch-registry=false
eureka.client.register-with-eureka=false 

# --- ACTUATOR CONFIGURATION ---
# Expose the health and info endpoints over HTTP
management.endpoints.web.exposure.include=health,info,metrics
# Show detailed health status (e.g., database connection status)
management.endpoint.health.show-details=always

# --- LOGGING CONFIGURATION ---
# Default log level for the whole application
logging.level.root=INFO
# Show detailed debug logs only for your specific code (change the package name accordingly)
logging.level.com.ridelink=DEBUG 