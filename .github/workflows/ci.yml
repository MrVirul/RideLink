name: CI Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: ridelink_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      ACCOUNT_DB_HOST: jdbc:postgresql://localhost:5432/ridelink_test
      ACCOUNT_DB_USER: postgres
      ACCOUNT_DB_PASSWORD: postgres
      JWT_SECRET: dGVzdC1zZWNyZXQta2V5LWZvci1jaS1waXBlbGluZS1hdC1sZWFzdC0yNTYtYml0cy1sb25nCg==
      DRIVER_DB_HOST: jdbc:postgresql://localhost:5432/ridelink_test
      DRIVER_DB_USER: postgres
      DRIVER_DB_PASSWORD: postgres
      FARE_DB_HOST: jdbc:postgresql://localhost:5432/ridelink_test
      FARE_DB_USER: postgres
      FARE_DB_PASSWORD: postgres
      RIDE_DB_HOST: jdbc:postgresql://localhost:5432/ridelink_test
      RIDE_DB_USER: postgres
      RIDE_DB_PASSWORD: postgres

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Grant execute permission for Maven wrapper
        run: chmod +x mvnw

      - name: Build and test with Maven
        run: ./mvnw -B clean verify

      - name: Upload Surefire test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: '**/target/surefire-reports/'
