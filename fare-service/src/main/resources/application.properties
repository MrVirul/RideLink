spring.config.import=optional:classpath:env.properties

spring.application.name=fare-service
server.port=8084

# Eureka Server
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true

spring.datasource.url=${FARE_DB_HOST}
spring.datasource.username=${FARE_DB_USER}
spring.datasource.password=${FARE_DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# --- ACTUATOR CONFIGURATION ---
# Expose the health and info endpoints over HTTP
management.endpoints.web.exposure.include=health,info,metrics
# Show detailed health status (e.g., database connection status)
management.endpoint.health.show-details=always

# --- LOGGING CONFIGURATION ---
# Default log level for the whole application
logging.level.root=INFO
# Show detailed debug logs only for your specific code (change the package name accordingly)
logging.level.com.ridelink=DEBUG
# Keep Hibernate SQL logs quiet unless there is a problem (show-sql=false, so use DEBUG here to see SQL when needed)
logging.level.org.hibernate.SQL=DEBUG

# --- OPENAPI / SWAGGER UI ---
# /v3/api-docs and /swagger-ui.html below are the springdoc defaults, restated here for
# discoverability. On this service they resolve to:
#   spec: http://localhost:8084/v3/api-docs
#   UI:   http://localhost:8084/swagger-ui.html
# Open the UI on the SERVICE PORT. Through the gateway only the raw spec resolves
# (http://localhost:8080/fare-service/v3/api-docs), because swagger-ui always requests its
# own config from the ROOT path /v3/api-docs/swagger-config, which the gateway does not route.
# The one UI that works through the gateway is the aggregated one on :8080/swagger-ui.html.
springdoc.swagger-ui.disable-swagger-default-url=true
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha
# Base URL advertised in this spec, used by the Swagger UI "Try it out" button.
# It points at the gateway so example calls follow the same /fare-service/... path a real
# client uses. Override it per environment, e.g.
#   OPENAPI_SERVERS_BASE_URL=https://api.example.com/fare-service
app.openapi.servers.base-url=${OPENAPI_SERVERS_BASE_URL:http://localhost:8080/fare-service}
