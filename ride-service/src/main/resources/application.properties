spring.config.import=optional:classpath:env.properties

spring.application.name=ride-service
server.port=8083

# Database Configuration
spring.datasource.url=${RIDE_DB_HOST}
spring.datasource.username=${RIDE_DB_USER}
spring.datasource.password=${RIDE_DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Eureka Server
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/

# Register this service with Eureka
eureka.client.register-with-eureka=true

# Fetch the registry from Eureka
eureka.client.fetch-registry=true