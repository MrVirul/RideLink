spring.application.name=api-gateway
server.port=8080

# --- GATEWAY CONFIGURATION ---
# This gateway uses Spring Cloud Gateway Server Web MVC (spring-cloud-gateway-server-webmvc),
# whose properties live under spring.cloud.gateway.server.webmvc.*. Routes are defined
# explicitly per service (the old reactive discovery.locator.* properties do not apply here).
spring.cloud.gateway.server.webmvc.routes[0].id=account-service
spring.cloud.gateway.server.webmvc.routes[0].uri=lb://ACCOUNT-SERVICE
spring.cloud.gateway.server.webmvc.routes[0].predicates[0].name=path
spring.cloud.gateway.server.webmvc.routes[0].predicates[0].args[patterns]=/account-service/**
spring.cloud.gateway.server.webmvc.routes[0].filters[0].name=stripPrefix
spring.cloud.gateway.server.webmvc.routes[0].filters[0].args[parts]=1

spring.cloud.gateway.server.webmvc.routes[1].id=driver-service
spring.cloud.gateway.server.webmvc.routes[1].uri=lb://DRIVER-SERVICE
spring.cloud.gateway.server.webmvc.routes[1].predicates[0].name=path
spring.cloud.gateway.server.webmvc.routes[1].predicates[0].args[patterns]=/driver-service/**
spring.cloud.gateway.server.webmvc.routes[1].filters[0].name=stripPrefix
spring.cloud.gateway.server.webmvc.routes[1].filters[0].args[parts]=1

spring.cloud.gateway.server.webmvc.routes[2].id=ride-service
spring.cloud.gateway.server.webmvc.routes[2].uri=lb://RIDE-SERVICE
spring.cloud.gateway.server.webmvc.routes[2].predicates[0].name=path
spring.cloud.gateway.server.webmvc.routes[2].predicates[0].args[patterns]=/ride-service/**
spring.cloud.gateway.server.webmvc.routes[2].filters[0].name=stripPrefix
spring.cloud.gateway.server.webmvc.routes[2].filters[0].args[parts]=1

spring.cloud.gateway.server.webmvc.routes[3].id=fare-service
spring.cloud.gateway.server.webmvc.routes[3].uri=lb://FARE-SERVICE
spring.cloud.gateway.server.webmvc.routes[3].predicates[0].name=path
spring.cloud.gateway.server.webmvc.routes[3].predicates[0].args[patterns]=/fare-service/**
spring.cloud.gateway.server.webmvc.routes[3].filters[0].name=stripPrefix
spring.cloud.gateway.server.webmvc.routes[3].filters[0].args[parts]=1
# --- ACTUATOR CONFIGURATION ---
# Expose the health and info endpoints over HTTP
management.endpoints.web.exposure.include=health,info,metrics
# Show detailed health status (e.g., database connection status)
management.endpoint.health.show-details=always

# --- LOGGING CONFIGURATION ---
# Default log level for the whole application
logging.level.root=INFO
# Show detailed debug logs only for your specific code (change the package name accordingly)
logging.level.com.ridelink=DEBUG
