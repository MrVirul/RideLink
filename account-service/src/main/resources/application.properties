spring.config.import=optional:classpath:env.properties

spring.application.name=account-service
server.port=8081

# Eureka
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true

# Database
spring.datasource.url=${ACCOUNT_DB_HOST}
spring.datasource.username=${ACCOUNT_DB_USER}
spring.datasource.password=${ACCOUNT_DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Actuator
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always

# Logging
logging.level.root=INFO
logging.level.com.ridelink=DEBUG
logging.level.org.hibernate.SQL=DEBUG

# JWT
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration=86400000

# --- OPENAPI / SWAGGER UI ---
# /v3/api-docs and /swagger-ui.html below are the springdoc defaults, restated here for
# discoverability. On this service they resolve to:
#   spec: http://localhost:8081/v3/api-docs
#   UI:   http://localhost:8081/swagger-ui.html
# Open the UI on the SERVICE PORT. Through the gateway only the raw spec resolves
# (http://localhost:8080/account-service/v3/api-docs), because swagger-ui always requests its
# own config from the ROOT path /v3/api-docs/swagger-config, which the gateway does not route.
# The one UI that works through the gateway is the aggregated one on :8080/swagger-ui.html.
springdoc.swagger-ui.disable-swagger-default-url=true
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha
# Base URL advertised in this spec, used by the Swagger UI "Try it out" button.
# It points at the gateway so example calls follow the same /account-service/... path a real
# client uses. Override it per environment, e.g.
#   OPENAPI_SERVERS_BASE_URL=https://api.example.com/account-service
app.openapi.servers.base-url=${OPENAPI_SERVERS_BASE_URL:http://localhost:8080/account-service}
