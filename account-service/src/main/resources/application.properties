spring.config.import=optional:classpath:env.properties

spring.application.name=account-service
server.port=8081

# Eureka Server Configuration
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true

# Database Configuration
spring.datasource.url=${ACCOUNT_DB_HOST}
spring.datasource.username=${ACCOUNT_DB_USER}
spring.datasource.password=${ACCOUNT_DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# --- ACTUATOR CONFIGURATION ---
# Expose the health and info endpoints over HTTP
management.endpoints.web.exposure.include=health,info,metrics
# Show detailed health status (e.g., database connection status)
management.endpoint.health.show-details=always

# --- LOGGING CONFIGURATION ---
# Default log level for the whole application
logging.level.root=INFO
# Show detailed debug logs only for your specific code (change the package name accordingly)
logging.level.com.ridelink=DEBUG
# Keep Hibernate SQL logs quiet unless there is a problem (show-sql=false, so use DEBUG here to see SQL when needed)
logging.level.org.hibernate.SQL=DEBUG

# --- JWT CONFIGURATION ---
# JWT signing secret (loaded from git-ignored env.properties)
app.jwt.secret=${JWT_SECRET}
# JWT expiration time in milliseconds (24 hours)
app.jwt.expiration=86400000